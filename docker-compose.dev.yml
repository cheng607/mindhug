services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: mindhug-postgres
    environment:
      POSTGRES_USER: mindhug
      POSTGRES_PASSWORD: mindhug
      POSTGRES_DB: mindhug
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindhug -d mindhug"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindhug-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindhug-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mindhug:mindhug@postgres:5432/mindhug
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-key-change-in-production
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
