name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          LLM_PROVIDER: mock
          RATE_LIMIT_ENABLED: "false"
        run: pytest tests/ -v --tb=short -m "not llm"

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Build frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test_integration.db
          LLM_PROVIDER: mock
          RATE_LIMIT_ENABLED: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 1235 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:1235/health && break
            sleep 2
          done

      - name: Start frontend preview
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:1235
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5174 && break
            sleep 2
          done

      - name: Run E2E checklist
        env:
          E2E_BASE_URL: http://127.0.0.1:5174
          E2E_API_URL: http://127.0.0.1:1235
        run: npm run e2e
